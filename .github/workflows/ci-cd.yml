name: CI/CD

on:
  push:
    branches: [main, Staging]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build backend
        run: dotnet build Backend/Backend.csproj

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: mobile
      - name: Type check
        run: npx tsc --noEmit
        working-directory: mobile

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.TEST_DB_CONNECTION_STRING }}
        run: dotnet test Backend.Tests/Backend.Tests.csproj

  deploy-backend:
    needs: [backend-build, mobile-typecheck, integration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Clean old publish
        run: rm -rf /home/eliaspi123/project/Backend/out
      - name: Publish backend
        run: |
          cd Backend
          dotnet publish -c Release -r linux-arm64 --self-contained false -o /home/eliaspi123/project/Backend/out
      - name: Apply migrations
        run: |
          export PATH="$PATH:/home/eliaspi123/.dotnet/tools:/home/eliaspi123/.dotnet"
          export DOTNET_ROOT=/home/eliaspi123/.dotnet
          export ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}"
          cd Backend
          dotnet ef database update
      - name: Restart backend
        run: |
          sudo systemctl restart myapp
